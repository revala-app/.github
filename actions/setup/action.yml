# The one Node setup every Revala repository's jobs run after actions/checkout: pnpm from the
# `packageManager` field, Node from `.node-version` (HAR-DEP-002), a check that engines and
# @types/node name the same major, then a frozen install.
#
#   - uses: actions/checkout@<sha> # vX
#   - uses: revala-app/.github/actions/setup@<sha> # main
#     with:
#       packages-token: ${{ secrets.SERVO_MAP_PACKAGES_TOKEN }}   # only where @revala-app packages are installed
#
# With `packages-token`, setup-node writes a user-level .npmrc for npm.pkg.github.com and the token
# is exported as NODE_AUTH_TOKEN for the rest of the job: pnpm re-verifies the lockfile against the
# registry on every command, not only on install.

name: Revala Node setup
description: pnpm, Node from .node-version, a Node-major check, and a frozen install.

inputs:
  packages-token:
    description: A read:packages token for the @revala-app scope on GitHub Packages. Omit when none is needed.
    required: false
    default: ""
  install:
    description: Run `pnpm install --frozen-lockfile`.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        # A self-hosted pod's name holds `-runner-`. It has a local pnpm store, and fetching this
        # cache over the home line took 3.5 minutes per job against 10 seconds to install from the store.
        cache: ${{ !contains(runner.name, '-runner-') && 'pnpm' || '' }}
        package-manager-cache: ${{ !contains(runner.name, '-runner-') }}
        registry-url: ${{ inputs.packages-token != '' && 'https://npm.pkg.github.com' || '' }}
        scope: ${{ inputs.packages-token != '' && '@revala-app' || '' }}

    - name: Export the packages token
      if: inputs.packages-token != ''
      shell: bash
      env:
        TOKEN: ${{ inputs.packages-token }}
      run: echo "NODE_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

    - name: Check the Node major
      shell: bash
      run: node "$GITHUB_ACTION_PATH/check-node-version.mjs"

    - name: Install
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
